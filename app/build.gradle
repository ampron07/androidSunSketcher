plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}

// Toggle flag for OpenCV support (defined in gradle.properties)
def useOpenCV = project.hasProperty("useOpenCV") && project.getProperty("useOpenCV") == "true"

android {
    compileSdk 36

    defaultConfig {
        applicationId "com.wkuxr.eclipsetotality"
        minSdk 31
        targetSdk 33
        versionCode 29
        versionName "1.0.7"

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField "boolean", "USE_OPENCV", useOpenCV.toString()
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    namespace 'com.wkuxr.sunsketcher'

    // Only include the CMake build if OpenCV is enabled
    // DISABLED: there is no src/main/cpp/CMakeLists.txt, and the app only uses OpenCV's Java API
    // (the :opencv module below supplies the native opencv_java4 library), so no CMake build is needed.
    // if (useOpenCV) {
    //    externalNativeBuild {
    //        cmake {
    //            path "src/main/cpp/CMakeLists.txt"
    //            arguments "-DUSE_OPENCV=${useOpenCV}"
    //       }
    //    }
    // }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'com.google.android.gms:play-services-location:20.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'com.google.android.things:androidthings:1.0'
    implementation 'androidx.databinding:databinding-runtime:7.1.2'
    implementation 'androidx.exifinterface:exifinterface:1.3.3'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation 'androidx.room:room-runtime:2.5.2'
    annotationProcessor 'androidx.room:room-compiler:2.5.2'
    kapt 'androidx.room:room-compiler:2.5.2'
    implementation 'commons-net:commons-net:3.9.0'
    implementation "androidx.fragment:fragment-ktx:1.6.2"
    implementation 'com.google.android.play:integrity:1.3.0'
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Include OpenCV only if enabled
    if (useOpenCV) {
        implementation project(':opencv')
    }
}